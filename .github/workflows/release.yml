name: Build & Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS App & Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Package ScrollClick.app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Compress ScrollClick.app to ZIP
        run: |
          zip -r ScrollClick-macOS.zip ScrollClick.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollClick-macOS
          path: ScrollClick-macOS.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ScrollClick-macOS.zip
          name: ScrollClick ${{ github.ref_name }}
          body: |
            ## ScrollClick Release ${{ github.ref_name }} 🖱️⚡

            ### What's Included:
            - **ScrollClick-macOS.zip**: Native macOS background Menu Bar application for Minecraft drag-clicking and scroll-to-mouse trigger.

            ### Installation:
            1. Download `ScrollClick-macOS.zip` and extract `ScrollClick.app`.
            2. Double-click `ScrollClick.app` to launch.
            3. Grant **Accessibility** permission in **System Settings → Privacy & Security → Accessibility** when prompted.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
